<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b12"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="turf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ea580c" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Slab -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="90" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.8"/>

  <!-- Infield Diamond Turf -->
  <polygon points="256,110 396,250 256,390 116,250" fill="url(#turf)" stroke="#ffffff" stroke-width="4" filter="url(#glow)"/>

  <!-- Dirt Mound -->
  <circle cx="256" cy="250" r="48" fill="#9a3412" stroke="#ea580c" stroke-width="3"/>
  <rect x="240" y="246" width="32" height="8" rx="2" fill="#ffffff"/>

  <!-- Base Bags -->
  <!-- 2B -->
  <rect x="244" y="98" width="24" height="24" fill="#ffffff" transform="rotate(45 256 110)"/>
  <!-- 1B -->
  <rect x="384" y="238" width="24" height="24" fill="#ffffff" transform="rotate(45 396 250)"/>
  <!-- 3B -->
  <rect x="104" y="238" width="24" height="24" fill="#ffffff" transform="rotate(45 116 250)"/>
  <!-- Home Plate -->
  <polygon points="256,400 270,386 270,374 242,374 242,386" fill="#ffffff"/>

  <!-- Crossed Bats -->
  <g stroke="#f59e0b" stroke-width="12" stroke-linecap="round" opacity="0.9">
    <line x1="140" y1="140" x2="372" y2="372"/>
    <line x1="372" y1="140" x2="140" y2="372"/>
  </g>

  <!-- CHOP Text Banner -->
  <rect x="116" y="280" width="280" height="64" rx="14" fill="#070b12" stroke="#ea580c" stroke-width="4" filter="url(#glow)"/>
  <text x="256" y="324" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="38" fill="#f59e0b" letter-spacing="4">BALTIMORE CHOP</text>

  <!-- 3D Brand Stamp -->
  <circle cx="256" cy="180" r="28" fill="#ea580c" stroke="#fef08a" stroke-width="3"/>
  <text x="256" y="190" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="28" fill="#ffffff">⚾</text>
</svg>
